<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mr.Patterson's Reader</title>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <main class="app-shell">
            <header class="app-header">
                <div>
                    <h1>Mr.Patterson's Reader</h1>
                    <p class="subtitle">Local text-to-speech with streamed playback</p>
                </div>
                <div id="backendBadge" class="backend-badge">WebAssembly</div>
            </header>

            <section id="statusBox" class="status-box" aria-live="polite">
                <span id="statusText">Loading models...</span>
            </section>

            <section class="workspace">
                <aside class="control-panel">
                    <div class="field-group">
                        <label for="fileInput">TXT file</label>
                        <input id="fileInput" type="file" accept=".txt,text/plain">
                    </div>

                    <div class="field-group">
                        <label for="text">Source text</label>
                        <textarea id="text">This morning, I took a walk in the park. The sound of the birds and the breeze was so pleasant that I stopped for a long time just to listen. Later, I sat by the window with a cup of coffee and read a few pages from a book I had been meaning to finish.</textarea>
                    </div>

                    <div class="field-grid">
                        <div class="field-group">
                            <label for="voiceStyleSelect">Voice</label>
                            <select id="voiceStyleSelect">
                                <option value="assets/voice_styles/M1.json">Male 1</option>
                                <option value="assets/voice_styles/M2.json">Male 2</option>
                                <option value="assets/voice_styles/M3.json">Male 3</option>
                                <option value="assets/voice_styles/M4.json">Male 4</option>
                                <option value="assets/voice_styles/M5.json">Male 5</option>
                                <option value="assets/voice_styles/F1.json">Female 1</option>
                                <option value="assets/voice_styles/F2.json">Female 2</option>
                                <option value="assets/voice_styles/F3.json">Female 3</option>
                                <option value="assets/voice_styles/F4.json">Female 4</option>
                                <option value="assets/voice_styles/F5.json">Female 5</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label for="langSelect">Language</label>
                            <select id="langSelect">
                                <option value="en" selected>English</option>
                                <option value="ko">Korean</option>
                                <option value="ja">Japanese</option>
                                <option value="ar">Arabic</option>
                                <option value="bg">Bulgarian</option>
                                <option value="cs">Czech</option>
                                <option value="da">Danish</option>
                                <option value="de">German</option>
                                <option value="el">Greek</option>
                                <option value="es">Spanish</option>
                                <option value="et">Estonian</option>
                                <option value="fi">Finnish</option>
                                <option value="fr">French</option>
                                <option value="hi">Hindi</option>
                                <option value="hr">Croatian</option>
                                <option value="hu">Hungarian</option>
                                <option value="id">Indonesian</option>
                                <option value="it">Italian</option>
                                <option value="lt">Lithuanian</option>
                                <option value="lv">Latvian</option>
                                <option value="nl">Dutch</option>
                                <option value="pl">Polish</option>
                                <option value="pt">Portuguese</option>
                                <option value="ro">Romanian</option>
                                <option value="ru">Russian</option>
                                <option value="sk">Slovak</option>
                                <option value="sl">Slovenian</option>
                                <option value="sv">Swedish</option>
                                <option value="tr">Turkish</option>
                                <option value="uk">Ukrainian</option>
                                <option value="vi">Vietnamese</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label for="totalStep">Steps</label>
                            <input type="number" id="totalStep" value="8" min="1" max="50">
                        </div>

                        <div class="field-group">
                            <label for="speed">Speed</label>
                            <input type="number" id="speed" value="1.05" min="0.5" max="2.0" step="0.05">
                        </div>
                    </div>

                    <div class="button-row">
                        <button id="generatePlayBtn" class="primary" disabled>Generate & Play</button>
                        <button id="pauseBtn" disabled>Pause</button>
                        <button id="resumeBtn" disabled>Resume</button>
                        <button id="stopBtn" disabled>Stop</button>
                    </div>

                    <div id="error" class="error" role="alert"></div>
                </aside>

                <section class="reader-panel">
                    <div class="reader-toolbar">
                        <div class="stats-grid">
                            <div class="stat">
                                <span>Chunks</span>
                                <strong id="chunkStat">0 / 0</strong>
                            </div>
                            <div class="stat">
                                <span>Generated</span>
                                <strong id="generatedStat">0</strong>
                            </div>
                            <div class="stat">
                                <span>Elapsed</span>
                                <strong id="elapsedStat">0:00</strong>
                            </div>
                            <div class="stat">
                                <span>Duration</span>
                                <strong id="durationStat">0:00</strong>
                            </div>
                        </div>
                        <button id="downloadBtn" class="download-button" disabled>Download WAV</button>
                    </div>

                    <div id="reader" class="reader" aria-label="Generated reader text">
                        <p class="reader-empty">Load text to build the reader.</p>
                    </div>
                </section>
            </section>
        </main>

        <script type="module" src="/main.js"></script>
    </body>
</html>
