<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Supertonic Voice Examples</title>
        <link rel="stylesheet" href="./voices.css">
    </head>
    <body>
        <main class="voice-shell">
            <header class="voice-header">
                <div>
                    <h1>Supertonic Voice Examples</h1>
                    <p class="subtitle">Compare the 10 bundled Supertonic voices with the same sample text.</p>
                </div>
                <a class="reader-link" href="./index.html">Open reader</a>
            </header>

            <section class="sample-panel">
                <div class="sample-copy">
                    <label for="sampleText">Preview text</label>
                    <textarea id="sampleText">Welcome to Supertonic Reader. This short preview lets you compare each bundled voice using the same sentence.</textarea>
                </div>
                <div class="settings-grid">
                    <label>
                        <span>Language</span>
                        <select id="languageSelect">
                            <option value="en" selected>English</option>
                            <option value="ko">Korean</option>
                            <option value="ja">Japanese</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                        </select>
                    </label>
                    <label>
                        <span>Steps</span>
                        <input id="stepInput" type="number" min="1" max="20" value="6">
                    </label>
                    <label>
                        <span>Speed</span>
                        <input id="speedInput" type="number" min="0.5" max="2" step="0.05" value="1.05">
                    </label>
                </div>
                <div class="action-row">
                    <button id="playAllButton" class="primary-action" type="button">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="8 5 19 12 8 19 8 5"></polygon></svg>
                        Play all voices
                    </button>
                    <button id="generateAllButton" type="button">Generate all previews</button>
                    <button id="stopButton" type="button" disabled>Stop</button>
                </div>
                <div id="statusBox" class="status-box" role="status" aria-live="polite">Ready. Choose a voice or play all voices.</div>
            </section>

            <section id="voiceGrid" class="voice-grid" aria-label="Bundled voice examples"></section>
        </main>

        <script type="module" src="./voices.js"></script>
    </body>
</html>
