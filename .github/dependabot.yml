version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/nodejs"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/py"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/go"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/java"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/csharp"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pub"
    directory: "/flutter"
    schedule:
      interval: "weekly"

  - package-ecosystem: "swift"
    directory: "/swift"
    schedule:
      interval: "weekly"
